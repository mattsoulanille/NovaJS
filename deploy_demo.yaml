steps:
  # Install dependencies
  - name: node:22
    id: install
    entrypoint: npm
    args: ['ci']

  # Test novajs. There is no game data here (Nova_Data is gitignored);
  # data-backed specs mark themselves pending, the rest gate the deploy.
  - name: node:22
    id: unittest
    entrypoint: npx
    args: ['turbo', 'run', 'test']
    waitFor: ['install']

  # Build the image — only once the tests pass.
  - name: 'gcr.io/cloud-builders/docker'
    id: build_image
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nova:dev', '-f', 'docker/Dockerfile', '.']
    waitFor: ['unittest']

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    id: push_image
    args: ['push', 'gcr.io/$PROJECT_ID/nova:dev']
    waitFor: ['build_image']

  # Deploy to cloud run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nova'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nova:dev'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--execution-environment=gen2'
      - '--add-volume=name=nova_data,type=cloud-storage,bucket=novajs-static-data'
      - '--add-volume-mount=volume=nova_data,mount-path=/mnt/nova_data'
      - '--set-env-vars=NOVA_DATA_PATH=/mnt/nova_data'
    waitFor: ['push_image']

timeout: 900s
options:
  machineType: 'E2_HIGHCPU_8'
